<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Burger House</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f6f6f6;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:16px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.cart-button{
    background:#ff9800;
    color:white;
    border:0;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.hero{
    background:linear-gradient(135deg,#111,#333);
    color:white;
    text-align:center;
    padding:45px 20px;
}

.hero h1{
    margin:0 0 10px;
    font-size:38px;
}

.hero p{
    margin:0;
    color:#ddd;
}

.filters{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

#searchInput{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
    outline:none;
    margin-bottom:15px;
}

.categories{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.category-btn{
    border:0;
    padding:10px 18px;
    border-radius:20px;
    background:#eee;
    cursor:pointer;
    font-size:15px;
}

.category-btn.active{
    background:#ff9800;
    color:white;
}

.products{
    max-width:1100px;
    margin:0 auto 40px;
    padding:0 15px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:20px;
}

.product-card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    transition:.2s;
    cursor:pointer;
}

.product-card:hover{
    transform:translateY(-4px);
}

.product-image{
    width:100%;
    height:190px;
    object-fit:cover;
    background:#eee;
}

.emoji-image{
    height:190px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:75px;
    background:#eee;
}

.product-info{
    padding:15px;
}

.product-name{
    font-size:20px;
    font-weight:bold;
    margin-bottom:7px;
}

.product-category{
    display:inline-block;
    background:#fff0d6;
    color:#e67e00;
    padding:5px 10px;
    border-radius:15px;
    font-size:12px;
    margin-bottom:10px;
}

.product-price{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.add-button{
    width:100%;
    background:#ff9800;
    color:white;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
}

.empty{
    text-align:center;
    grid-column:1/-1;
    padding:40px;
    color:#777;
}

/* تفاصيل المنتج */

.product-modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    z-index:5000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.product-modal-box{
    background:white;
    width:500px;
    max-width:100%;
    max-height:90vh;
    overflow-y:auto;
    border-radius:18px;
    position:relative;
    overflow:hidden;
}

.modal-close{
    position:absolute;
    left:15px;
    top:15px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:20px;
    cursor:pointer;
    z-index:2;
}

.modal-image{
    width:100%;
    height:280px;
    object-fit:cover;
    background:#eee;
}

.modal-emoji{
    width:100%;
    height:280px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:100px;
    background:#eee;
}

.modal-content{
    padding:25px;
}

.modal-content h2{
    margin-top:0;
    font-size:27px;
}

.modal-category{
    display:inline-block;
    background:#fff0d6;
    color:#e67e00;
    padding:6px 12px;
    border-radius:15px;
    font-size:13px;
    margin-bottom:12px;
}

.modal-price{
    font-size:24px;
    font-weight:bold;
    margin:10px 0 20px;
}

.modal-description{
    color:#666;
    line-height:1.8;
    margin-bottom:20px;
}

.modal-add{
    width:100%;
    padding:14px;
    background:#ff9800;
    color:white;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

/* السلة */

.cart{
    position:fixed;
    top:0;
    right:-420px;
    width:390px;
    max-width:95%;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:-5px 0 20px rgba(0,0,0,.2);
    transition:.3s;
    padding:20px;
    overflow-y:auto;
}

.cart.open{
    right:0;
}

.cart-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close-cart{
    border:0;
    background:#eee;
    border-radius:8px;
    padding:8px 12px;
    cursor:pointer;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #eee;
    padding:12px 0;
}

.cart-item-info{
    flex:1;
}

.cart-item-name{
    font-weight:bold;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:7px;
    margin-top:7px;
}

.cart-controls button{
    border:0;
    background:#eee;
    width:28px;
    height:28px;
    border-radius:6px;
    cursor:pointer;
}

.remove-item{
    color:#d00;
    cursor:pointer;
    font-size:13px;
    margin-top:6px;
}

.cart-total{
    font-size:21px;
    font-weight:bold;
    margin:20px 0;
}

.checkout-button{
    width:100%;
    background:#111;
    color:white;
    border:0;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

/* الطلب */

.checkout{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:3000;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.checkout-box{
    background:white;
    width:500px;
    max-width:100%;
    border-radius:15px;
    padding:25px;
}

.checkout-box h2{
    margin-top:0;
}

.checkout-box input,
.checkout-box textarea,
.checkout-box select{
    width:100%;
    padding:12px;
    margin:7px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}

.checkout-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.checkout-actions button{
    flex:1;
    padding:12px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.confirm-order{
    background:#ff9800;
    color:white;
}

.cancel-order{
    background:#eee;
}

.success{
    text-align:center;
    padding:20px;
}

.order-number{
    font-size:25px;
    font-weight:bold;
    color:#ff9800;
    margin:15px;
}

.track-button{
    background:#111;
    color:white;
    border:0;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

footer{
    background:#111;
    color:#aaa;
    text-align:center;
    padding:25px;
}

@media(max-width:600px){

    .hero h1{
        font-size:29px;
    }

    .cart{
        width:100%;
        right:-100%;
    }

    .products{
        grid-template-columns:1fr;
    }

    .modal-image,
    .modal-emoji{
        height:220px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        🍔 Burger House
    </div>

    <button class="cart-button" onclick="openCart()">
        🛒 السلة
        <span id="cartCount">0</span>
    </button>

</header>

<section class="hero">

    <h1>🍔 Burger House</h1>

    <p>
        أشهى الوجبات والمشروبات بأفضل الأسعار
    </p>

</section>

<div class="filters">

    <input
        id="searchInput"
        type="text"
        placeholder="🔎 ابحث عن وجبة..."
        oninput="filterProducts()"
    >

    <div class="categories">

        <button class="category-btn active"
                onclick="setCategory('الكل',this)">
            الكل
        </button>

        <button class="category-btn"
                onclick="setCategory('برغر',this)">
            🍔 برغر
        </button>

        <button class="category-btn"
                onclick="setCategory('وجبات',this)">
            🍟 وجبات
        </button>

        <button class="category-btn"
                onclick="setCategory('مشروبات',this)">
            🥤 مشروبات
        </button>

        <button class="category-btn"
                onclick="setCategory('حلويات',this)">
            🍰 حلويات
        </button>

    </div>

</div>

<div class="products" id="products">

    <div class="empty">
        جاري تحميل المنتجات...
    </div>

</div>

<!-- تفاصيل المنتج -->

<div class="product-modal" id="productModal">

    <div class="product-modal-box">

        <button class="modal-close" onclick="closeProductModal()">
            ✕
        </button>

        <div id="modalImage"></div>

        <div class="modal-content">

            <div id="modalCategory"></div>

            <h2 id="modalName"></h2>

            <div class="modal-price">
                <span id="modalPrice"></span>
                د.أ
            </div>

            <div class="modal-description" id="modalDescription"></div>

            <button class="modal-add" id="modalAddButton">
                🛒 أضف إلى السلة
            </button>

        </div>

    </div>

</div>

<!-- السلة -->

<div class="cart" id="cart">

    <div class="cart-header">

        <h2>🛒 سلة الطلب</h2>

        <button class="close-cart" onclick="closeCart()">
            ✕
        </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-total">

        الإجمالي:
        <span id="cartTotal">0.00</span>
        د.أ

    </div>

    <button class="checkout-button" onclick="openCheckout()">
        إتمام الطلب
    </button>

</div>

<!-- نموذج الطلب -->

<div class="checkout" id="checkout">

    <div class="checkout-box">

        <h2>📦 بيانات الطلب</h2>

        <input type="text" id="customerName" placeholder="الاسم">

        <input type="text" id="customerPhone" placeholder="رقم الهاتف">

        <textarea
            id="customerAddress"
            placeholder="العنوان"
            rows="3"></textarea>

        <select id="orderType">

            <option value="delivery">
                🚚 توصيل
            </option>

            <option value="pickup">
                🏪 استلام من المطعم
            </option>

        </select>

        <div class="checkout-actions">

            <button class="confirm-order" onclick="submitOrder()">
                تأكيد الطلب
            </button>

            <button class="cancel-order" onclick="closeCheckout()">
                إلغاء
            </button>

        </div>

    </div>

</div>

<footer>
    Burger House © 2026
</footer>

<script>

const API = "";

let products = [];
let cart = [];
let selectedCategory = "الكل";


/* تحميل المنتجات */

async function loadProducts(){

    try{

        const response = await fetch(API + "/api/products");

        if(!response.ok){
            throw new Error("فشل تحميل المنتجات");
        }

        products = await response.json();

        displayProducts();

    }catch(error){

        console.error(error);

        document.getElementById("products").innerHTML = `
            <div class="empty">
                ❌ تعذر تحميل المنتجات
            </div>
        `;
    }
}


/* عرض المنتجات */

function displayProducts(){

    const container = document.getElementById("products");

    container.innerHTML = "";

    if(products.length === 0){

        container.innerHTML = `
            <div class="empty">
                لا توجد منتجات حالياً
            </div>
        `;

        return;
    }

    products.forEach(product => {

        const description = product.description || "";

        const parts = description.split(" | ");

        const category = parts[0] || "وجبات";

        const image = parts[1] || "";

        const extraDescription =
            parts[2] ||
            "وجبة شهية ومحضرة بعناية من Burger House";

        const card = document.createElement("div");

        card.className = "product-card";

        card.dataset.category = category;

        card.dataset.name = product.name;

        let imageHTML;

        if(image){

            imageHTML = `
                <img
                    class="product-image"
                    src="${image}"
                    alt="${product.name}"
                    onerror="this.style.display='none'"
                >
            `;

        }else{

            imageHTML = `
                <div class="emoji-image">
                    🍔
                </div>
            `;
        }

        card.innerHTML = `

            ${imageHTML}

            <div class="product-info">

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="product-category">
                    ${category}
                </div>

                <div class="product-price">
                    ${Number(product.price).toFixed(2)}
                    د.أ
                </div>

                <button
                    class="add-button"
                    onclick="event.stopPropagation(); addToCart(${product.id})">

                    🛒 أضف إلى السلة

                </button>

            </div>
        `;

        card.onclick = function(){

            openProductModal(product.id);

        };

        container.appendChild(card);

    });

    filterProducts();
}


/* تفاصيل المنتج */

function openProductModal(id){

    const product =
        products.find(p => Number(p.id) === Number(id));

    if(!product){
        return;
    }

    const description = product.description || "";

    const parts = description.split(" | ");

    const category = parts[0] || "وجبات";

    const image = parts[1] || "";

    const extraDescription =
        parts[2] ||
        "وجبة شهية ومحضرة بعناية من Burger House";

    document.getElementById("modalName").textContent =
        product.name;

    document.getElementById("modalCategory").innerHTML =
        `<span class="modal-category">${category}</span>`;

    document.getElementById("modalPrice").textContent =
        Number(product.price).toFixed(2);

    document.getElementById("modalDescription").textContent =
        extraDescription;

    const modalImage =
        document.getElementById("modalImage");

    if(image){

        modalImage.innerHTML = `
            <img
                class="modal-image"
                src="${image}"
                alt="${product.name}"
                onerror="this.outerHTML='<div class=&quot;modal-emoji&quot;>🍔</div>'"
            >
        `;

    }else{

        modalImage.innerHTML = `
            <div class="modal-emoji">
                🍔
            </div>
        `;
    }

    document.getElementById("modalAddButton").onclick =
        function(){

            addToCart(product.id);

            closeProductModal();

        };

    document.getElementById("productModal").style.display =
        "flex";
}


/* إغلاق التفاصيل */

function closeProductModal(){

    document.getElementById("productModal").style.display =
        "none";
}


document.getElementById("productModal")
.addEventListener("click",function(event){

    if(event.target === this){

        closeProductModal();

    }

});


/* التصنيفات */

function setCategory(category,button){

    selectedCategory = category;

    document
        .querySelectorAll(".category-btn")
        .forEach(function(btn){

            btn.classList.remove("active");

        });

    button.classList.add("active");

    filterProducts();
}


/* البحث */

function filterProducts(){

    const search =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const cards =
        document.querySelectorAll(".product-card");

    let visible = 0;

    cards.forEach(function(card){

        const name =
            (card.dataset.name || "")
            .toLowerCase();

        const category =
            card.dataset.category || "";

        const searchMatch =
            name.includes(search);

        const categoryMatch =
            selectedCategory === "الكل" ||
            category === selectedCategory;

        if(searchMatch && categoryMatch){

            card.style.display = "";

            visible++;

        }else{

            card.style.display = "none";

        }

    });

    let noResult =
        document.getElementById("noResult");

    if(visible === 0 && cards.length > 0){

        if(!noResult){

            noResult =
                document.createElement("div");

            noResult.id = "noResult";

            noResult.className = "empty";

            noResult.textContent =
                "🔎 لا توجد منتجات مطابقة";

            document
                .getElementById("products")
                .appendChild(noResult);
        }

    }else{

        if(noResult){
            noResult.remove();
        }

    }
}


/* إضافة للسلة */

function addToCart(id){

    const product =
        products.find(p => Number(p.id) === Number(id));

    if(!product){

        alert("المنتج غير موجود");

        return;
    }

    const existing =
        cart.find(item => Number(item.id) === Number(id));

    if(existing){

        existing.quantity++;

    }else{

        cart.push({

            id: product.id,

            name: product.name,

            price: Number(product.price),

            quantity: 1

        });

    }

    updateCart();

    openCart();
}


/* تحديث السلة */

function updateCart(){

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;

    let count = 0;

    if(cart.length === 0){

        container.innerHTML = `
            <div class="empty">
                🛒 السلة فارغة
            </div>
        `;
    }

    cart.forEach(function(item,index){

        total += item.price * item.quantity;

        count += item.quantity;

        const div =
            document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `

            <div class="cart-item-info">

                <div class="cart-item-name">
                    ${item.name}
                </div>

                <div>
                    ${(item.price * item.quantity).toFixed(2)}
                    د.أ
                </div>

                <div class="cart-controls">

                    <button
                        onclick="changeQuantity(${index},1)">
                        +
                    </button>

                    <span>
                        ${item.quantity}
                    </span>

                    <button
                        onclick="changeQuantity(${index},-1)">
                        -
                    </button>

                </div>

                <div
                    class="remove-item"
                    onclick="removeFromCart(${index})">

                    حذف

                </div>

            </div>
        `;

        container.appendChild(div);

    });

    document.getElementById("cartTotal").textContent =
        total.toFixed(2);

    document.getElementById("cartCount").textContent =
        count;
}


/* زيادة / نقصان الكمية */

function changeQuantity(index,change){

    if(!cart[index]){
        return;
    }

    cart[index].quantity += change;

    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }

    updateCart();
}


/* حذف منتج */

function removeFromCart(index){

    cart.splice(index,1);

    updateCart();
}


/* فتح السلة */

function openCart(){

    document.getElementById("cart")
        .classList.add("open");
}


/* إغلاق السلة */

function closeCart(){

    document.getElementById("cart")
        .classList.remove("open");
}


/* فتح نموذج الطلب */

function openCheckout(){

    if(cart.length === 0){

        alert("السلة فارغة");

        return;
    }

    document.getElementById("checkout")
        .style.display = "flex";
}


/* إغلاق نموذج الطلب */

function closeCheckout(){

    document.getElementById("checkout")
        .style.display = "none";
}


/* إرسال الطلب */

async function submitOrder(){

    const customerName =
        document.getElementById("customerName")
        .value.trim();

    const phone =
        document.getElementById("customerPhone")
        .value.trim();

    const address =
        document.getElementById("customerAddress")
        .value.trim();

    const orderType =
        document.getElementById("orderType")
        .value;

    if(!customerName){

        alert("اكتب الاسم");

        return;
    }

    if(!phone){

        alert("اكتب رقم الهاتف");

        return;
    }

    if(!address && orderType === "delivery"){

        alert("اكتب العنوان");

        return;
    }

    if(cart.length === 0){

        alert("السلة فارغة");

        return;
    }

    let total = 0;

    cart.forEach(function(item){

        total += item.price * item.quantity;

    });

    const orderData = {

        customerName: customerName,

        phone: phone,

        address: address,

        orderType: orderType,

        total: total,

        items: cart.map(function(item){

            return {

                productId: item.id,

                quantity: item.quantity,

                price: item.price

            };

        })

    };

    try{

        const response =
            await fetch(API + "/api/orders",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(orderData)

            });

        const result =
            await response.json();

        if(!response.ok){

            throw new Error(
                result.error || "حدث خطأ في إرسال الطلب"
            );

        }

        const orderId = result.orderId;

        document.getElementById("checkout").innerHTML = `

            <div class="checkout-box success">

                <h2>
                    ✅ تم استلام طلبك بنجاح
                </h2>

                <div>
                    رقم الطلب
                </div>

                <div class="order-number">
                    #${orderId}
                </div>

                <p>
                    يمكنك متابعة حالة طلبك من خلال الزر التالي.
                </p>

                <button
                    class="track-button"
                    onclick="window.location.href='track.html?id=${orderId}'">

                    🚚 متابعة الطلب

                </button>

            </div>

        `;

        cart = [];

        updateCart();

        closeCart();

    }catch(error){

        console.error(error);

        alert(
            "❌ تعذر إرسال الطلب: " +
            error.message
        );
    }
}


/* تشغيل الموقع */

loadProducts();

updateCart();

</script>

</body>
</html>
