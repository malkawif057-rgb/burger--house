<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل دخول المدير - Burger House</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            background: #1c1c1c;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ffb000;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: #292929;
            color: white;
            font-size: 16px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ffb000;
            color: #111;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ffc533;
        }

        .error {
            color: #ff5555;
            margin-top: 15px;
            display: none;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🍔</div>

    <h1>Burger House</h1>

    <input
        type="text"
        id="username"
        placeholder="اسم المستخدم"
    >

    <input
        type="password"
        id="password"
        placeholder="كلمة المرور"
    >

    <button onclick="login()">
        🔐 تسجيل الدخول
    </button>

    <div class="error" id="error">
        ❌ اسم المستخدم أو كلمة المرور غير صحيحة
    </div>

    <a href="index.html" class="back">
        ← العودة للمطعم
    </a>

</div>

<script>

function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "admin" && password === "1234") {

        localStorage.setItem("adminLoggedIn", "true");

        window.location.href = "admin.html";

    } else {

        document.getElementById("error").style.display = "block";

    }

}

</script>

</body>
</html>
